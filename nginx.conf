server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # ── HTML — never cache (so new bundles load immediately) ──
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── Static assets with aggressive caching ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Backend API routes — proxy to FastAPI on port 8000 ──
    location ~* ^/(municipalities|analyze-location|climate|satellite-indicators|auth|chat|history|analysis|sensors|geo|soil|predict|irrigation-plans|reports|dashboard/summary|model/metrics|tasks|docs|redoc|openapi\.json|health)($|/) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── SPA fallback — serve index.html for non-file, non-API routes ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
